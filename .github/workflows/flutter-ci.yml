name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  quality:
    name: Format, analyze, unit + widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --reporter expanded

  integration:
    name: Integration navigation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Run integration_test suite
        run: flutter test integration_test -d flutter-tester --reporter expanded


  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      # Flag-off on purpose. Proves a meeting build without defines still
      # compiles. Do not upload this APK — the handoff file is demo-apk.
      - name: Build unsigned release APK
        run: flutter build apk --release

  # One installable file for CAB / Jessica. Compile defaults stay off so
  # local and PR test runs still see the fake Nearby list.
  demo-apk:
    name: Demo release APK (live Nearby)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Record demo defines
        run: |
          {
            echo "### Demo APK"
            echo "- \`LIVE_NEARBY=true\` (real OSM places)"
            echo "- \`HELP_NOW_LIVE=false\` (Help Now buttons do not dial)"
            echo "- sha \`${{ github.sha }}\`"
            echo "- Flutter \`${{ env.FLUTTER_VERSION }}\`"
            echo ""
            echo "Signed with the runner debug key. Uninstall any older copy before installing a new artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build demo release APK
        run: |
          flutter build apk --release \
            --dart-define=LIVE_NEARBY=true \
            --dart-define=HELP_NOW_LIVE=false
      - name: Upload demo release APK
        uses: actions/upload-artifact@v4
        with:
          name: cwc-demo-apk-live-nearby-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
